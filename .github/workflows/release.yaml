name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - iOS # Build an iOS player.
          - Android # Build an Android .apk standalone app.

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.ULRICH_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.ULRICH_UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.ULRICH_UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The exported .unitypackage is platform independent -- `build` packages Assets, not
      # a player -- so it is built once here instead of in each `plugin` matrix leg. Two
      # legs each uploading an identical package under one artifact name is a 409 Conflict
      # on upload-artifact@v4.
      #
      # NOTE: this step needs a Unity executable on the runner. build.gradle's
      # getUnityExePath() reads $UNITY_EXE and otherwise falls back to a macOS Unity Hub
      # path, so on ubuntu-latest it throws "Unable to find Unity executable". Either point
      # UNITY_EXE at an editor available to this runner or move the step into a Unity
      # container/self-hosted macOS runner.
      - name: Build Unity Package
        run: ./gradlew build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-package
          path: ./build/airship-*.unitypackage
          # Fail loudly rather than uploading nothing: a stale glob here previously left
          # the release job to fail on a missing artifact instead.
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [plugin, package]
    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Verify Version
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          PLUGIN_VERSION=$(./gradlew -q getPluginVersion)
          if [[ $PLUGIN_VERSION = $VERSION ]]; then exit 0 ; else exit 1; fi

      - name: Get the release notes
        id: get_release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          delimiter="$(openssl rand -hex 8)"
          {
            echo "NOTES<<${delimiter}"
            awk "/## Version $VERSION/{flag=1;next}/## Version/{flag=0}flag" CHANGELOG.md
            echo ${delimiter}
          } >> $GITHUB_OUTPUT

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: unity-build-package
          path: ./build

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_release_notes.outputs.NOTES }}
          files: ./build/airship-${{ steps.get_version.outputs.VERSION }}.unitypackage
          # Without this a name mismatch publishes a release with no plugin attached.
          fail_on_unmatched_files: true

  publish-docs:
    needs: [release]
    uses: ./.github/workflows/publish-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
