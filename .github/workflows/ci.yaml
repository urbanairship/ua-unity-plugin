name: CI

on: [pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - iOS # Build an iOS player.
          - Android # Build an Android .apk standalone app.

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Docs
        run: |
          sudo apt-get install doxygen
          ./gradlew docs:build
        
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.ULRICH_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.ULRICH_UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.ULRICH_UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

  # The unity-plugin module is a plain Android library: no Unity, and so no Unity license
  # seat. Nothing in CI compiled it before -- no AAR is checked in, and the `ci` job's Unity
  # build never invokes this gradle module -- so Kotlin changes reached review unverified.
  android-library:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile the Android plugin
        run: ./gradlew :unity-plugin:assembleRelease

  # The test assembly was already being compiled by the `ci` job, but nothing ever ran the
  # tests, so they could not fail a PR.
  #
  # Sequenced after `ci` rather than run beside it: every Unity job holds a serial license
  # seat for its duration and the `ci` matrix already holds two, so running this in parallel
  # would need a third simultaneous seat.
  tests:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      # unityVersion defaults to auto, which reads ProjectSettings/ProjectVersion.txt, so
      # there is no editor version to keep in sync here. EditMode because Tests.asmdef is
      # Editor-only.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.ULRICH_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.ULRICH_UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.ULRICH_UNITY_SERIAL }}
        with:
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
