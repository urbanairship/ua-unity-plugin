task clean(type: Delete) {
    delete "$buildDir"
}

task build {
    doLast() {
        exec {
            executable "doxygen"
            args "Doxyfile"
            environment "VERSION", airshipProperties.version
        }

        copy {
            from "theme"
            into "build/html"
            include "doxy-boot.js", "header.html", "footer.html"
        }
    }
    finalizedBy 'packageDocs'
}

task packageDocs(type: Tar, dependsOn: 'build') {
    into ('./') {
        from 'build/html'
    }

    archiveFileName = "${airshipProperties.version}.tar.gz"
    compression = Compression.GZIP

    destinationDirectory = file('build')
    archiveExtension.set('tar.gz')
    compression = Compression.GZIP
}
