pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        ivy {
            url 'https://github.com'
            patternLayout {
                artifact '[organisation]/[module]/archive/[revision].[ext]'
            }
            metadataSources {
                artifact()
            }
        }
    }
}

include ':unity-plugin', ':docs'
